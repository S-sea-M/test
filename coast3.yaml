            - primaryPersonId
            - otherPersonIds
            - spendLimit
            - requestReceipts
            - requestMemos
          properties:
            type:
              type: string
              enum:
                - subscription
              example: subscription
            name:
              $ref: '#/components/schemas/CardName'
            creatorPersonId:
              $ref: '#/components/schemas/PersonId'
            primaryPersonId:
              description: The primary person whose name appears on purchases for this card
              $ref: '#/components/schemas/PersonId'
            otherPersonIds:
              description: >-
                Other people allowed to use this card in addition to the primary
                person
              type: array
              minItems: 0
              items:
                $ref: '#/components/schemas/PersonId'
            spendLimit:
              anyOf:
                - $ref: '#/components/schemas/CardSpendingLimit'
                - $ref: '#/components/schemas/Null'
            requestReceipts:
              type: boolean
              example: true
            requestMemos:
              type: boolean
              example: true
          additionalProperties: false
        - description: Create Everyday Purchase Card Request
          title: CreateEverydayPurchaseCardRequest
          type: object
          required:
            - type
            - name
            - primaryPersonId
            - spendLimit
          properties:
            type:
              type: string
              enum:
                - everydayPurchase
              example: everydayPurchase
            name:
              $ref: '#/components/schemas/CardName'
            primaryPersonId:
              description: The primary person whose name appears on purchases for this card
              $ref: '#/components/schemas/PersonId'
            spendLimit:
              anyOf:
                - $ref: '#/components/schemas/CardSpendingLimit'
                - $ref: '#/components/schemas/Null'
          additionalProperties: false
    VirtualCard:
      $schema: 'https://json-schema.org/draft/2020-12/schema'
      description: Virtual Card object
      oneOf:
        - $ref: '#/components/schemas/EverydayPurchaseCard'
        - $ref: '#/components/schemas/ProjectCard'
        - $ref: '#/components/schemas/SubscriptionCard'
    DepartmentId:
      $schema: 'https://json-schema.org/draft/2020-12/schema'
      description: Department identifier
      type: string
      pattern: ^dprt_.*$
      examples:
        - dprt_1asb3143
    DepartmentName:
      $schema: 'https://json-schema.org/draft/2020-12/schema'
      description: Name for department
      type: string
      minLength: 1
      maxLength: 40
      examples:
        - Maintenance
    Department:
      $schema: 'https://json-schema.org/draft/2020-12/schema'
      description: Department
      type: object
      required:
        - id
        - accountId
        - name
      properties:
        id:
          $ref: '#/components/schemas/DepartmentId'
        accountId:
          $ref: '#/components/schemas/AccountId'
        name:
          $ref: '#/components/schemas/DepartmentName'
      additionalProperties: false
    DepartmentNotFoundError:
      $schema: 'https://json-schema.org/draft/2020-12/schema'
      type: object
      required:
        - type
        - departmentId
      properties:
        type:
          type: string
          const: departmentNotFound
          example: departmentNotFound
        departmentId:
          $ref: '#/components/schemas/DepartmentId'
      additionalProperties: false
    DepartmentInUseBadRequestError:
      $schema: 'https://json-schema.org/draft/2020-12/schema'
      type: object
      description: >
        The department is still in use and cannot be deleted. Please remove all
        assignments before deleting.
      required:
        - type
        - departmentId
      properties:
        type:
          type: string
          const: departmentInUseBadRequest
          example: departmentInUseBadRequest
        departmentId:
          $ref: '#/components/schemas/DepartmentId'
      additionalProperties: false
    LocationId:
      $schema: 'https://json-schema.org/draft/2020-12/schema'
      description: Location identifier
      type: string
      pattern: ^lctn_.*$
      examples:
        - lctn_a382c8234
    LocationName:
      $schema: 'https://json-schema.org/draft/2020-12/schema'
      description: Name for location
      type: string
      minLength: 1
      maxLength: 40
      examples:
        - Louisville
    StreetAddress:
      $schema: 'https://json-schema.org/draft/2020-12/schema'
      description: Street address
      type: string
      minLength: 1
      examples:
        - 123 Fake Street
    StreetAddress2:
      $schema: 'https://json-schema.org/draft/2020-12/schema'
      description: Second line of the street address
      type: string
      minLength: 1
      examples:
        - Suite 456
    City:
      $schema: 'https://json-schema.org/draft/2020-12/schema'
      description: City
      type: string
      minLength: 1
      examples:
        - Springfield
    Location:
      $schema: 'https://json-schema.org/draft/2020-12/schema'
      description: Location
      type: object
      required:
        - id
        - accountId
        - name
        - streetAddress
        - streetAddress2
        - city
        - state
        - zip
      properties:
        id:
          $ref: '#/components/schemas/LocationId'
        accountId:
          $ref: '#/components/schemas/AccountId'
        name:
          $ref: '#/components/schemas/LocationName'
        streetAddress:
          anyOf:
            - $ref: '#/components/schemas/StreetAddress'

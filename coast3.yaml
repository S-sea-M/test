components:
  securitySchemes:
    ApiKeyAuth:
      x-displayName: Account API Key
      description: |
        Account-scoped API Key. This can be retrieved from the portal's
        [API Keys page](https://portal.coastpay.com/api-keys).

        ```
          Authorization: Bearer cak_123
        ```
      type: apiKey
      in: header
      name: Authorization
  schemas:
    AccountId:
      $schema: 'https://json-schema.org/draft/2020-12/schema'
      description: Account identifier
      type: string
      pattern: ^flt_.*$
      examples:
        - flt_eaf256sced
    AccountName:
      $schema: 'https://json-schema.org/draft/2020-12/schema'
      description: Name for an account
      type: string
      minLength: 1
      maxLength: 128
      examples:
        - Pest Demolishers
    Email:
      $schema: 'https://json-schema.org/draft/2020-12/schema'
      description: Email
      type: string
      format: email
      example: person@example.com
    'Null':
      $schema: 'https://json-schema.org/draft/2020-12/schema'
      type: 'null'
      title: 'null'
      description: No value
    USState:
      $schema: 'https://json-schema.org/draft/2020-12/schema'
      description: Two letter code for representing a US State.
      type: string
      enum:
        - AL
        - AK
        - AZ
        - AR
        - CA
        - CO
        - CT
        - DE
        - DC
        - FL
        - GA
        - HI
        - ID
        - IL
        - IN
        - IA
        - KS
        - KY
        - LA
        - ME
        - MD
        - MA
        - MI
        - MN
        - MS
        - MO
        - MT
        - NE
        - NV
        - NH
        - NJ
        - NM
        - NY
        - NC
        - ND
        - OH
        - OK
        - OR
        - PA
        - RI
        - SC
        - SD
        - TN
        - TX
        - UT
        - VT
        - VA
        - WA
        - WV
        - WI
        - WY
      examples:
        - PA
    ZipCode:
      $schema: 'https://json-schema.org/draft/2020-12/schema'
      description: ZIP code
      type: string
      examples:
        - '12345'
        - 12345-7890
    Address:
      $schema: 'https://json-schema.org/draft/2020-12/schema'
      description: Address
      type: object
      required:
        - streetAddress
        - streetAddress2
        - city
        - state
        - zip
      properties:
        streetAddress:
          description: The first line of the street address
          type: string
          minLength: 1
          examples:
            - 123 Fake Street
        streetAddress2:
          description: The second line of the street address
          anyOf:
            - type: string
              minLength: 1
              examples:
                - Suite 456
            - $ref: '#/components/schemas/Null'
        city:
          description: The city for the address
          type: string
          minLength: 1
          examples:
            - Springfield
        state:
          description: The state for the address
          $ref: '#/components/schemas/USState'
        zip:
          description: The zip code for the address
          $ref: '#/components/schemas/ZipCode'
      additionalProperties: false
    VehicleIdentificationMethod:
      $schema: 'https://json-schema.org/draft/2020-12/schema'
      description: >
        The method of vehicle identification used by this account for users to
        sign into a card.
      type: object
      required:
        - type
        - displayName
      properties:
        type:
          description: The type of vehicle identification method used by the account.
          type: string
          enum:
            - licensePlate
            - vehicleName
          examples:
            - licensePlate
            - vehicleName
        displayName:
          description: >-
            The name of the field for SMS. Required to be set for type
            vehicleName, always null for type licensePlate.
          anyOf:
            - type: string
              minLength: 1
              maxLength: 24
            - $ref: '#/components/schemas/Null'
      additionalProperties: false
    AccountSettings:
      $schema: 'https://json-schema.org/draft/2020-12/schema'
      description: Account settings object
      type: object
      required:
        - vehicleIdentificationMethod
      properties:
        vehicleIdentificationMethod:
          $ref: '#/components/schemas/VehicleIdentificationMethod'
      additionalProperties: false
    Account:
      $schema: 'https://json-schema.org/draft/2020-12/schema'
      description: Account object
      type: object
      required:
        - id
        - name
        - legalName
        - companyEmail
        - address
        - settings
      properties:
        id:
          description: |
            The unique identifier for this account.
          $ref: '#/components/schemas/AccountId'
        name:
          description: >
            The display name of this business. This is shown in the dashboard
            and on the physical cards.
          $ref: '#/components/schemas/AccountName'
        legalName:
          description: |
            The legal name of this business.
          $ref: '#/components/schemas/AccountName'
        companyEmail:
          description: |
            The email used for this business.
          $ref: '#/components/schemas/Email'
        address:
          description: |
            This account's business address.
          $ref: '#/components/schemas/Address'
        settings:
          description: |
            The settings for this account.
          $ref: '#/components/schemas/AccountSettings'
      additionalProperties: false
    BadRequestError:
      $schema: 'https://json-schema.org/draft/2020-12/schema'
      type: object
      required:
        - type
      properties:
        type:
          type: string
          const: badRequest
          example: badRequest
      additionalProperties: false
    InvalidAccountIdFormatError:
      $schema: 'https://json-schema.org/draft/2020-12/schema'
      type: object
      description: |
        The account ID format is invalid. Account IDs must start with 'flt_'.
      required:
        - type
        - accountId
      properties:
        type:
          type: string
          const: invalidAccountIdFormat
          example: invalidAccountIdFormat
        accountId:
          type: string
          description: The invalid account ID that was provided
          example: notflt_123
      additionalProperties: false
    ErrorMessage:
      $schema: 'https://json-schema.org/draft/2020-12/schema'
      description: The error message
      type: object
      required:
        - message
      properties:
        message:
          type: string
          description: The error message
      additionalProperties: false
    AuthenticationError:
      $schema: 'https://json-schema.org/draft/2020-12/schema'
      type: object
      required:
        - type
      properties:
        type:
          type: string
          const: authentication
          example: authentication
      additionalProperties: false
    ForbiddenError:
      $schema: 'https://json-schema.org/draft/2020-12/schema'
      type: object
      required:
        - type
      properties:
        type:
          type: string
          const: forbidden
          example: forbidden
      additionalProperties: false
    AccountNotFoundError:
      $schema: 'https://json-schema.org/draft/2020-12/schema'
      type: object
      required:
        - type
        - accountId
      properties:
        type:
          type: string
          const: accountNotFound
          example: accountNotFound
        accountId:
          $ref: '#/components/schemas/AccountId'
      additionalProperties: false
    TooManyRequestsError:
      $schema: 'https://json-schema.org/draft/2020-12/schema'
      type: object
      required:
        - type
      properties:
        type:
          type: string
          const: tooManyRequests
          example: tooManyRequests
      additionalProperties: false
    InternalServerError:
      $schema: 'https://json-schema.org/draft/2020-12/schema'
      type: object
      description: Internal Server Error
      required:
        - type
      properties:
        type:
          type: string
          const: internalServer
          example: internalServer
      additionalProperties: false
    DisplayNameRequiredError:
      $schema: 'https://json-schema.org/draft/2020-12/schema'
      type: object
      description: >
        displayName is required when vehicleIdentificationMethod type is
        vehicleName.
      required:
        - type
      properties:
        type:
          type: string
          const: displayNameRequired
          example: displayNameRequired
      additionalProperties: false
    NullDisplayNameRequiredError:
      $schema: 'https://json-schema.org/draft/2020-12/schema'
      type: object
      description: >
        displayName must be null when vehicleIdentificationMethod type is
        licensePlate.
      required:
        - type
      properties:
        type:
          type: string
          const: nullDisplayNameRequired
          example: nullDisplayNameRequired
      additionalProperties: false
    DuplicateLicensePlatesExistError:
      $schema: 'https://json-schema.org/draft/2020-12/schema'
      type: object
      description: >
        Cannot change vehicleIdentificationMethod type to licensePlate because
        duplicate license plates exist.
      required:
        - type
      properties:
        type:
          type: string
          const: duplicateLicensePlatesExist
          example: duplicateLicensePlatesExist
      additionalProperties: false
    DuplicateVehicleNamesExistError:
      $schema: 'https://json-schema.org/draft/2020-12/schema'
      type: object
      description: >
        Cannot change vehicleIdentificationMethod type to vehicleName because
        duplicate vehicle names exist.
      required:
        - type
      properties:
        type:
          type: string
          const: duplicateVehicleNamesExist
          example: duplicateVehicleNamesExist
      additionalProperties: false
    PersonId:
      $schema: 'https://json-schema.org/draft/2020-12/schema'
      description: Person identifier
      type: string
      pattern: ^user_.*$
      examples:
        - user_1234
    VehicleId:
      $schema: 'https://json-schema.org/draft/2020-12/schema'
      description: Vehicle identifier
      type: string
      pattern: ^vehl_.*$
      examples:
        - vehl_1234
    CardStatus:
      $schema: 'https://json-schema.org/draft/2020-12/schema'
      description: |
        The status for a card.
        * Cancelled cards cannot be reactivated.
        * To change the status of a frozen card, call support.
        * Expired cards have passed their expiration date.
      type: string
      enum:
        - active
        - cancelled
        - locked
        - frozen
        - expired
      example: active
    NextPageToken:
      $schema: 'https://json-schema.org/draft/2020-12/schema'
      description: >-
        Token for retrieving the next page of results. If null or not present,
        there are no more pages available.
      type:
        - string
        - 'null'
      examples:
        - eyJwYWdlIjoyLCJsaW1pdCI6MTB9
    CardId:
      $schema: 'https://json-schema.org/draft/2020-12/schema'
      description: Card identifier
      type: string
      pattern: ^ic_.*$
      examples:
        - ic_1234
    AccountId-2:
      $schema: 'https://json-schema.org/draft/2020-12/schema'
      description: Account identifier
      type: string
      pattern: ^flt_.*$
      examples:
        - flt_1234
    CardLastFour:
      $schema: 'https://json-schema.org/draft/2020-12/schema'
      description: Last four digits of the card number
      type: string
      pattern: '^[0-9]{4}$'
      examples:
        - '1234'
    FleetCardId:
      $schema: 'https://json-schema.org/draft/2020-12/schema'
      description: Unique card ID as assigned by Coast. Only applies to fleet cards.
      type: string
      pattern: '^[A-Z0-9]{6,7}$'
      minLength: 6
      maxLength: 7
      examples:
        - ABC123
        - ABCD123
    GasStationRestriction:
      $schema: 'https://json-schema.org/draft/2020-12/schema'
      description: Gas station restriction for fleet card
      type: string
      enum:
        - fuelOnly
        - fuelAndMaintenance
        - unrestricted
      example: fuelOnly
    FleetCard:
      $schema: 'https://json-schema.org/draft/2020-12/schema'
      description: Fleet Card
      type: object
      required:
        - id
        - accountId
        - type
        - last4
        - status
        - fleetCardId
        - assignedPersonId
        - gasStationRestriction
      properties:
        id:
          $ref: '#/components/schemas/CardId'
        accountId:
          $ref: '#/components/schemas/AccountId-2'
        type:
          type: string
          const: fleet
          example: fleet
        last4:
          $ref: '#/components/schemas/CardLastFour'
        status:
          $ref: '#/components/schemas/CardStatus'
        fleetCardId:
          $ref: '#/components/schemas/FleetCardId'
        assignedPersonId:
          description: The current person assigned to this card.
          anyOf:
            - $ref: '#/components/schemas/PersonId'
            - $ref: '#/components/schemas/Null'
              description: No person assigned to this card
        gasStationRestriction:
          $ref: '#/components/schemas/GasStationRestriction'
      additionalProperties: false
    CardName:
      $schema: 'https://json-schema.org/draft/2020-12/schema'
      description: Name for the card
      type: string
      minLength: 1
      examples:
        - Party Expenses
    SpendLimitFrequency:
      $schema: 'https://json-schema.org/draft/2020-12/schema'
      description: Spend limit frequency
      type: string
      enum:
        - daily
        - weekly
        - monthly
        - lifetime
      examples:
        - daily
        - weekly
        - monthly
        - lifetime
    CardSpendingLimit:
      $schema: 'https://json-schema.org/draft/2020-12/schema'
      description: Card Spending Limit
      type: object
      required:
        - amount
        - frequency
      properties:
        amount:
          description: Limit amount in cents
          type: number
          example: 10000
        frequency:
          description: The frequency that the limit is applied to
          $ref: '#/components/schemas/SpendLimitFrequency'
      additionalProperties: false
    EverydayPurchaseCard:
      $schema: 'https://json-schema.org/draft/2020-12/schema'
      description: Everyday Purchase Card
      type: object
      required:
        - id
        - accountId
        - type
        - last4
        - status
        - name
        - primaryPersonId
        - spendLimit
      properties:
        id:
          $ref: '#/components/schemas/CardId'
        accountId:
          $ref: '#/components/schemas/AccountId-2'
        type:
          type: string
          const: everydayPurchase
          example: everydayPurchase
        last4:
          $ref: '#/components/schemas/CardLastFour'
        status:
          $ref: '#/components/schemas/CardStatus'
        name:
          $ref: '#/components/schemas/CardName'
          examples:
            - Bob's Marketing Card
        primaryPersonId:
          description: >-
            The primary person assigned to this card who permanently owns this
            card
          $ref: '#/components/schemas/PersonId'
        spendLimit:
          description: The spending limits for this card
          anyOf:
            - $ref: '#/components/schemas/CardSpendingLimit'
            - $ref: '#/components/schemas/Null'
      additionalProperties: false
    PersonalizedCard:
      $schema: 'https://json-schema.org/draft/2020-12/schema'
      description: Personalized Card
      type: object
      required:
        - id
        - accountId
        - type
        - last4
        - status
        - name
        - ownerPersonId
        - gasStationRestriction
      properties:
        id:
          $ref: '#/components/schemas/CardId'
        accountId:
          $ref: '#/components/schemas/AccountId-2'
        type:
          type: string
          const: personalized
          example: personalized
        last4:
          $ref: '#/components/schemas/CardLastFour'
        status:
          $ref: '#/components/schemas/CardStatus'
        name:
          $ref: '#/components/schemas/CardName'
          examples:
            - Bob's card
        ownerPersonId:
          description: The person who permanently owns this card
          $ref: '#/components/schemas/PersonId'
        gasStationRestriction:
          $ref: '#/components/schemas/GasStationRestriction'
      additionalProperties: false
    PolicyId:
      $schema: 'https://json-schema.org/draft/2020-12/schema'
      description: Policy identifier
      type: string
      pattern: ^plcy_.*$
      examples:
        - plcy_1234
    ProjectCard:
      $schema: 'https://json-schema.org/draft/2020-12/schema'
      description: Project Card
      type: object
      required:
        - id
        - accountId
        - type
        - last4
        - status
        - name
        - projectBudgetId
        - primaryPersonId
        - spendLimit
      properties:
        id:
          $ref: '#/components/schemas/CardId'
        accountId:
          $ref: '#/components/schemas/AccountId-2'
        type:
          type: string
          const: project
          example: project
        last4:
          $ref: '#/components/schemas/CardLastFour'
        status:
          $ref: '#/components/schemas/CardStatus'
        name:
          $ref: '#/components/schemas/CardName'
          examples:
            - Party Expenses
        projectBudgetId:
          description: >-
            The policy id for the project budget permanently assigned to this
            card.
          $ref: '#/components/schemas/PolicyId'
        primaryPersonId:
          description: The primary person assigned to this card
          $ref: '#/components/schemas/PersonId'
        spendLimit:
          description: The spending limits for this card
          anyOf:
            - $ref: '#/components/schemas/CardSpendingLimit'
            - $ref: '#/components/schemas/Null'
      additionalProperties: false
    VehiclePinCard:
      $schema: 'https://json-schema.org/draft/2020-12/schema'
      description: Vehicle Pin Card
      type: object
      required:
        - id
        - accountId
        - type
        - last4
        - status
        - ownerVehicleId
        - gasStationRestriction
      properties:
        id:
          $ref: '#/components/schemas/CardId'
        accountId:
          $ref: '#/components/schemas/AccountId-2'
        type:
          type: string
          const: vehiclePin
          example: vehiclePin
        last4:
          $ref: '#/components/schemas/CardLastFour'
        status:
          $ref: '#/components/schemas/CardStatus'
        ownerVehicleId:
          description: The vehicle that is currently assigned to this card.
          anyOf:
            - $ref: '#/components/schemas/VehicleId'
            - $ref: '#/components/schemas/Null'
              description: No vehicle assigned to this card
        gasStationRestriction:
          $ref: '#/components/schemas/GasStationRestriction'
      additionalProperties: false
    SubscriptionCard:
      $schema: 'https://json-schema.org/draft/2020-12/schema'
      description: Subscription Card
      type: object
      required:
        - id
        - accountId
        - type
        - last4
        - status
        - name
        - primaryPersonId
        - otherPersonIds
        - spendLimit
        - requestReceipts
        - requestMemos
      properties:
        id:
          $ref: '#/components/schemas/CardId'
        accountId:
          $ref: '#/components/schemas/AccountId-2'
        type:
          type: string
          const: subscription
          example: subscription
        last4:
          $ref: '#/components/schemas/CardLastFour'
        status:
          $ref: '#/components/schemas/CardStatus'
        name:
          $ref: '#/components/schemas/CardName'
          examples:
            - Comcast Internet
        primaryPersonId:
          description: The primary person assigned to this card
          $ref: '#/components/schemas/PersonId'
        otherPersonIds:
          description: Other persons assigned to this card
          type: array
          items:
            $ref: '#/components/schemas/PersonId'
        spendLimit:
          description: The spending limits for this card
          anyOf:
            - $ref: '#/components/schemas/CardSpendingLimit'
            - $ref: '#/components/schemas/Null'
        requestReceipts:
          type: boolean
          example: true
        requestMemos:
          type: boolean
          example: true
      additionalProperties: false
    Card:
      $schema: 'https://json-schema.org/draft/2020-12/schema'
      description: Card object
      oneOf:
        - $ref: '#/components/schemas/FleetCard'
        - $ref: '#/components/schemas/EverydayPurchaseCard'
        - $ref: '#/components/schemas/PersonalizedCard'
        - $ref: '#/components/schemas/ProjectCard'
        - $ref: '#/components/schemas/VehiclePinCard'
        - $ref: '#/components/schemas/SubscriptionCard'
    CardNotFoundError:
      $schema: 'https://json-schema.org/draft/2020-12/schema'
      type: object
      required:
        - type
        - cardId
      properties:
        type:
          type: string
          const: cardNotFound
          example: cardNotFound
        cardId:
          $ref: '#/components/schemas/CardId'
      additionalProperties: false
    UpdatableCardStatus:
      $schema: 'https://json-schema.org/draft/2020-12/schema'
      description: >
        The status that can be set for a card via the update API.

        Note: 'expired' status cannot be set manually - it is automatically
        applied when a card expires.

        * Cancelled cards cannot be reactivated.

        * To change the status of a frozen card, call support.
      type: string
      enum:
        - active
        - cancelled
        - locked
        - frozen
      example: active
    PublicUpdateCardRequest:
      $schema: 'https://json-schema.org/draft/2020-12/schema'
      description: Update Card Request
      type: object
      oneOf:
        - description: Update Personalized Card Request
          title: UpdatePersonalizedCardRequest
          type: object
          required:
            - type
          properties:
            type:
              type: string
              enum:
                - personalized
              example: personalized
            status:
              $ref: '#/components/schemas/UpdatableCardStatus'
          additionalProperties: false
        - description: Update Fleet Card Request
          title: UpdateFleetCardRequest
          type: object
          required:
            - type
          properties:
            type:
              type: string
              enum:
                - fleet
              example: fleet
            status:
              $ref: '#/components/schemas/UpdatableCardStatus'
            assignedPersonId:
              description: The person assigned to this card
              oneOf:
                - $ref: '#/components/schemas/PersonId'
                - $ref: '#/components/schemas/Null'
          additionalProperties: false
        - description: Update Vehicle Pin Card Request
          title: UpdateVehiclePinCardRequest
          type: object
          required:
            - type
          properties:
            type:
              type: string
              enum:
                - vehiclePin
              example: vehiclePin
            status:
              $ref: '#/components/schemas/UpdatableCardStatus'
          additionalProperties: false
        - description: Update Project Card Request
          title: UpdateProjectCardRequest
          type: object
          required:
            - type
          properties:
            type:
              type: string
              enum:
                - project
              example: project
            status:
              $ref: '#/components/schemas/UpdatableCardStatus'
            name:
              $ref: '#/components/schemas/CardName'
            spendLimit:
              anyOf:
                - $ref: '#/components/schemas/CardSpendingLimit'
                - $ref: '#/components/schemas/Null'
          additionalProperties: false
        - description: Update Subscription Card Request
          title: UpdateSubscriptionCardRequest
          type: object
          required:
            - type
          properties:
            type:
              type: string
              enum:
                - subscription
              example: subscription
            status:
              $ref: '#/components/schemas/UpdatableCardStatus'
            name:
              $ref: '#/components/schemas/CardName'
            primaryPersonId:
              description: The person whose name appears on purchases for this card
              $ref: '#/components/schemas/PersonId'
            otherPersonIds:
              description: >-
                Other people allowed to use this card in addition to the primary
                person
              type: array
              minItems: 0
              items:
                $ref: '#/components/schemas/PersonId'
            sharedByPersonId:
              description: >-
                The person who is sharing the card (required when otherPersonIds
                is provided)
              $ref: '#/components/schemas/PersonId'
            spendLimit:
              anyOf:
                - $ref: '#/components/schemas/CardSpendingLimit'
                - $ref: '#/components/schemas/Null'
            requestReceipts:
              type: boolean
              example: true
            requestMemos:
              type: boolean
              example: true
          additionalProperties: false
        - description: Update Everyday Purchase Card Request
          title: UpdateEverydayPurchaseCardRequest
          type: object
          required:
            - type
          properties:
            type:
              type: string
              enum:
                - everydayPurchase
              example: everydayPurchase
            status:
              $ref: '#/components/schemas/UpdatableCardStatus'
            name:
              $ref: '#/components/schemas/CardName'
            spendLimit:
              anyOf:
                - $ref: '#/components/schemas/CardSpendingLimit'
                - $ref: '#/components/schemas/Null'
          additionalProperties: false
    CardFrozenBadRequestError:
      $schema: 'https://json-schema.org/draft/2020-12/schema'
      type: object
      description: |
        The card is frozen. Please contact support to unfreeze the card.
      required:
        - type
        - cardId
      properties:
        type:
          type: string
          const: cardFrozenBadRequest
          example: cardFrozenBadRequest
        cardId:
          $ref: '#/components/schemas/CardId'
      additionalProperties: false
    CardCancelledBadRequestError:
      $schema: 'https://json-schema.org/draft/2020-12/schema'
      type: object
      description: |
        The card is cancelled. Cancelled cards cannot be updated.
      required:
        - type
        - cardId
      properties:
        type:
          type: string
          const: cardCancelledBadRequest
          example: cardCancelledBadRequest
        cardId:
          $ref: '#/components/schemas/CardId'
      additionalProperties: false
    CardExpiredBadRequestError:
      $schema: 'https://json-schema.org/draft/2020-12/schema'
      type: object
      description: |
        The card is expired. Expired cards cannot be updated.
      required:
        - type
        - cardId
      properties:
        type:
          type: string
          const: cardExpiredBadRequest
          example: cardExpiredBadRequest
        cardId:
          $ref: '#/components/schemas/CardId'
      additionalProperties: false
    ProjectBudgetId:
      $schema: 'https://json-schema.org/draft/2020-12/schema'
      description: Project budget identifier
      type: string
      pattern: ^plcy_.*$
      examples:
        - plcy_asdf283
    PublicOrderVirtualCardRequest:
      $schema: 'https://json-schema.org/draft/2020-12/schema'

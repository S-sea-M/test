    ZipCode-2:
      $schema: 'https://json-schema.org/draft/2020-12/schema'
      description: ZIP code
      type: string
    MerchantCountry:
      $schema: 'https://json-schema.org/draft/2020-12/schema'
      description: |
        Three-letter code for the merchant country
      anyOf:
        - type: string
          minLength: 3
          maxLength: 3
        - $ref: '#/components/schemas/Null'
    PurchaseMerchantCategory:
      $schema: 'https://json-schema.org/draft/2020-12/schema'
      description: Coast merchant category id
      type: string
      minLength: 1
      pattern: ^ctgy_.*$
    PurchaseMerchantCategoryCode:
      $schema: 'https://json-schema.org/draft/2020-12/schema'
      description: 4 digit Visa merchant category code
      type: string
      pattern: '^[0-9]{4}$'
    PurchaseMerchantSnapshot:
      $schema: 'https://json-schema.org/draft/2020-12/schema'
      description: Merchant object
      type: object
      required:
        - id
        - name
        - address
        - state
        - city
        - zip
        - country
        - category
        - categoryCode
        - latitude
        - longitude
      properties:
        id:
          description: 'A unique identifier for the merchant, if one exists'
          anyOf:
            - $ref: '#/components/schemas/PurchaseMerchantLocationId'
            - $ref: '#/components/schemas/Null'
        name:
          $ref: '#/components/schemas/PurchaseMerchantName'
        address:
          description: Merchant address
          anyOf:
            - type: string
              minLength: 1
            - $ref: '#/components/schemas/Null'
        state:
          description: Two character code representing state or region
          anyOf:
            - $ref: '#/components/schemas/USState-2'
            - type: string
              minLength: 2
              maxLength: 2
        city:
          description: Merchant city
          type: string
          minLength: 1
        zip:
          description: Merchant zip code
          $ref: '#/components/schemas/ZipCode-2'
        country:
          $ref: '#/components/schemas/MerchantCountry'
        category:
          $ref: '#/components/schemas/PurchaseMerchantCategory'
        categoryCode:
          $ref: '#/components/schemas/PurchaseMerchantCategoryCode'
        latitude:
          anyOf:
            - $ref: '#/components/schemas/GpsLocation'
            - $ref: '#/components/schemas/Null'
        longitude:
          anyOf:
            - $ref: '#/components/schemas/GpsLocation'
            - $ref: '#/components/schemas/Null'
      additionalProperties: false
    FieldId:
      $schema: 'https://json-schema.org/draft/2020-12/schema'
      description: Field identifier
      type: string
      minLength: 1
      pattern: ^attr_.*$
    PurchaseFieldString:
      $schema: 'https://json-schema.org/draft/2020-12/schema'
      title: PurchaseFieldString
      description: |
        String value purchase field
      type: object
      required:
        - type
        - id
        - value
        - isRequired
      properties:
        type:
          type: string
          const: string
        id:
          $ref: '#/components/schemas/FieldId'
        value:
          anyOf:
            - type: string
              minLength: 1
            - $ref: '#/components/schemas/Null'
        isRequired:
          description: |
            If true, this field is required on the purchase
          type: boolean
      additionalProperties: false
    PurchaseFieldBoolean:
      $schema: 'https://json-schema.org/draft/2020-12/schema'
      title: PurchaseFieldBoolean
      description: |
        Boolean value transaction field
      type: object
      required:
        - type
        - id
        - value
        - isRequired
      properties:
        type:
          type: string
          const: boolean
        id:
          $ref: '#/components/schemas/FieldId'
        value:
          anyOf:
            - type: boolean
            - $ref: '#/components/schemas/Null'
        isRequired:
          description: |
            If true, this field is required on the purchase
          type: boolean
      additionalProperties: false
    PurchaseField:
      $schema: 'https://json-schema.org/draft/2020-12/schema'
      description: Purchase field
      oneOf:
        - $ref: '#/components/schemas/PurchaseFieldString'
        - $ref: '#/components/schemas/PurchaseFieldBoolean'
    PurchaseFields:
      $schema: 'https://json-schema.org/draft/2020-12/schema'
      description: Purchase fields
      type: object
      required: []
      properties: {}
      additionalProperties:
        x-additionalPropertiesName: fieldName
        $ref: '#/components/schemas/PurchaseField'
    PendingPurchase:
      $schema: 'https://json-schema.org/draft/2020-12/schema'
      description: Pending Purchase object
      type: object
      required:
        - id
        - accountId
        - status
        - amount
        - createdTime
        - card
        - memo
        - receipts
        - personSnapshot
        - vehicleSnapshot
        - merchantSnapshot
        - fields
      properties:
        id:
          $ref: '#/components/schemas/PurchaseId'
        accountId:
          $ref: '#/components/schemas/AccountId-3'
        status:
          description: The current status of the purchase
          type: string
          const: pending
        amount:
          description: The amount of the purchase in cents
          type: integer
        createdTime:
          description: The timestamp for when the purchase was made
          type: string
          format: date-time
        card:
          description: The card used to make the purchase
          anyOf:
            - $ref: '#/components/schemas/PurchaseCard'
            - $ref: '#/components/schemas/Null'
        memo:
          description: Memo for purchase
          anyOf:
            - $ref: '#/components/schemas/PurchaseMemo'
            - $ref: '#/components/schemas/Null'
        receipts:
          description: Receipts for purchase
          type: array
          items:
            $ref: '#/components/schemas/PurchaseReceipt'
        personSnapshot:
          description: Person who was signed into the card at the time of the purchase
          anyOf:
            - $ref: '#/components/schemas/PurchasePersonSnapshot'
            - $ref: '#/components/schemas/Null'
        vehicleSnapshot:
          description: Vehicle that was signed into the card at the time of the purchase
          anyOf:
            - $ref: '#/components/schemas/PurchaseVehicleSnapshot'
            - $ref: '#/components/schemas/Null'
        merchantSnapshot:
          description: The merchant associated with this purchase
          $ref: '#/components/schemas/PurchaseMerchantSnapshot'
        fields:
          description: Custom fields for the purchase
          $ref: '#/components/schemas/PurchaseFields'
      additionalProperties: false
    ISO8601DateTime:
      $schema: 'https://json-schema.org/draft/2020-12/schema'
      description: An ISO 8601 compatible timestamp
      type: string
      format: date-time
    FuelType:
      $schema: 'https://json-schema.org/draft/2020-12/schema'
      description: Fuel type
      type: string
      enum:
        - diesel
        - unleadedRegular
        - unleadedPlus
        - unleadedSuper
        - other
    FuelUnit:
      $schema: 'https://json-schema.org/draft/2020-12/schema'
      description: Fuel unit
      type: string
      enum:
        - usGallon
        - liter
        - other
    PurchaseFuel:
      $schema: 'https://json-schema.org/draft/2020-12/schema'
      description: Fuel object
      type: object
      required:
        - type
        - unit
        - costPerUnit
        - volume
      properties:
        type:
          description: 'Fuel type, if available'
          anyOf:
            - $ref: '#/components/schemas/FuelType'
            - $ref: '#/components/schemas/Null'
        unit:
          description: 'Fuel unit, if available'
          anyOf:
            - $ref: '#/components/schemas/FuelUnit'
            - $ref: '#/components/schemas/Null'
        costPerUnit:
          description: 'Fuel price per unit in US cents, if available'
          anyOf:
            - type: integer
            - $ref: '#/components/schemas/Null'
        volume:
          description: 'Units of fuel as an integer of three decimal places, if available'
          anyOf:
            - type: integer
            - $ref: '#/components/schemas/Null'
      additionalProperties: false
    PurchaseDetails:
      $schema: 'https://json-schema.org/draft/2020-12/schema'
      description: |
        Details for the purchase object
      type: object
      required:
        - fuel
      properties:
        fuel:
          description: |
            Fuel details for the purchase
          anyOf:
            - $ref: '#/components/schemas/PurchaseFuel'
            - $ref: '#/components/schemas/Null'
      additionalProperties: false
    CompletedPurchase:
      $schema: 'https://json-schema.org/draft/2020-12/schema'
      description: Completed Purchase object
      type: object
      required:
        - id
        - accountId
        - status
        - amount
        - createdTime
        - completedTime
        - card
        - personSnapshot
        - vehicleSnapshot
        - memo
        - receipts
        - merchantSnapshot
        - fields
        - purchaseDetails
        - rebate
      properties:
        id:
          $ref: '#/components/schemas/PurchaseId'
        accountId:
          $ref: '#/components/schemas/AccountId-3'
        status:
          description: The current status of the purchase
          type: string
          const: completed
        amount:
          description: The amount of the purchase in cents
          type: integer
        createdTime:
          description: The timestamp for when the purchase was made
          $ref: '#/components/schemas/ISO8601DateTime'
        completedTime:
          description: The timestamp for when the purchase cleared
          $ref: '#/components/schemas/ISO8601DateTime'
        card:
          description: The card used to make the purchase
          anyOf:
            - $ref: '#/components/schemas/PurchaseCard'
            - $ref: '#/components/schemas/Null'
        memo:
          description: Memo for purchase
          anyOf:
            - $ref: '#/components/schemas/PurchaseMemo'
            - $ref: '#/components/schemas/Null'
        receipts:
          description: Receipts for purchase
          type: array
          items:
            $ref: '#/components/schemas/PurchaseReceipt'
        personSnapshot:
          description: Person who was signed into the card at the time of the purchase
          anyOf:
            - $ref: '#/components/schemas/PurchasePersonSnapshot'
            - $ref: '#/components/schemas/Null'
        vehicleSnapshot:
          description: Vehicle that was signed into the card at the time of the purchase
          anyOf:
            - $ref: '#/components/schemas/PurchaseVehicleSnapshot'
            - $ref: '#/components/schemas/Null'
        merchantSnapshot:
          description: The merchant associated with this purchase
          $ref: '#/components/schemas/PurchaseMerchantSnapshot'
        fields:
          description: Custom fields for the purchase
          $ref: '#/components/schemas/PurchaseFields'
        purchaseDetails:
          description: The purchase details data associated with this purchase
          $ref: '#/components/schemas/PurchaseDetails'
        rebate:
          description: The rebate amount for this purchase in cents
          type: integer
      additionalProperties: false
    PurchaseDeclineReason:
      $schema: 'https://json-schema.org/draft/2020-12/schema'
      description: Purchase decline reason object
      type: object
      properties:
        type:
          description: A unique type for the decline reason
          type: string
          minLength: 1
        description:
          description: |
            A detailed description describing the reason for decline
          type: string
          minLength: 1
      additionalProperties: false
    DeclinedPurchase:
      $schema: 'https://json-schema.org/draft/2020-12/schema'
      description: Declined Purchase object
      type: object
      required:
        - id
        - accountId
        - status
        - amount
        - createdTime
        - completedTime
        - card
        - personSnapshot
        - vehicleSnapshot
        - merchantSnapshot
      properties:
        id:
          $ref: '#/components/schemas/PurchaseId'
        accountId:
          $ref: '#/components/schemas/AccountId-3'
        status:
          description: The current status of the purchase
          type: string
          const: declined
        amount:
          description: The amount of the purchase in cents
          type: integer
        createdTime:
          description: The timestamp for when the purchase was made
          $ref: '#/components/schemas/ISO8601DateTime'
        completedTime:
          description: The timestamp for when the purchase cleared
          $ref: '#/components/schemas/ISO8601DateTime'
        card:
          description: The card used to make the purchase
          anyOf:
            - $ref: '#/components/schemas/PurchaseCard'
            - $ref: '#/components/schemas/Null'
        personSnapshot:
          description: Person who was signed into the card at the time of the purchase
          anyOf:
            - $ref: '#/components/schemas/PurchasePersonSnapshot'
            - $ref: '#/components/schemas/Null'
        vehicleSnapshot:
          description: Vehicle that was signed into the card at the time of the purchase
          anyOf:
            - $ref: '#/components/schemas/PurchaseVehicleSnapshot'
            - $ref: '#/components/schemas/Null'
        merchantSnapshot:
          description: The merchant associated with this purchase
          $ref: '#/components/schemas/PurchaseMerchantSnapshot'
        declineReason:
          description: |
            The reason this purchase was declined.
          $ref: '#/components/schemas/PurchaseDeclineReason'
      additionalProperties: false
    Purchase:
      $schema: 'https://json-schema.org/draft/2020-12/schema'
      description: Purchase object
      oneOf:
        - $ref: '#/components/schemas/PendingPurchase'
        - $ref: '#/components/schemas/CompletedPurchase'
        - $ref: '#/components/schemas/DeclinedPurchase'
    BadRequestError-3:
      $schema: 'https://json-schema.org/draft/2020-12/schema'
      type: object
      required:
        - type
      properties:
        type:
          type: string
          const: badRequest
      additionalProperties: false
    AuthenticationError-3:
      $schema: 'https://json-schema.org/draft/2020-12/schema'
      type: object
      required:
        - type
      properties:
        type:
          type: string
          const: authentication
      additionalProperties: false
    ForbiddenError-3:
      $schema: 'https://json-schema.org/draft/2020-12/schema'
      type: object
      required:
        - type
      properties:
        type:
          type: string
          const: forbidden
      additionalProperties: false
    TooManyRequestsError-3:
      $schema: 'https://json-schema.org/draft/2020-12/schema'
      type: object
      required:
        - type
      properties:
        type:
          type: string
          const: tooManyRequests
      additionalProperties: false
    InternalServerError-3:
      $schema: 'https://json-schema.org/draft/2020-12/schema'
      type: object
      description: Internal Server Error
      required:
        - type
      properties:
        type:
          type: string
          const: internalServer
      additionalProperties: false
    PurchaseNotFoundError:
      $schema: 'https://json-schema.org/draft/2020-12/schema'
      type: object
      required:
        - type
        - purchaseId
      properties:
        type:
          type: string
          const: purchaseNotFound
        purchaseId:
          $ref: '#/components/schemas/PurchaseId'
      additionalProperties: false
    DepartmentId-4:
      $schema: 'https://json-schema.org/draft/2020-12/schema'
      description: Department identifier
      type: string
      pattern: ^dprt_.*$
      examples:
        - dprt_1234
    LocationId-4:
      $schema: 'https://json-schema.org/draft/2020-12/schema'
      description: Location identifier
      type: string
      pattern: ^lctn_.*$
      examples:
        - lctn_1234
    VehicleName-2:
      $schema: 'https://json-schema.org/draft/2020-12/schema'
      description: Friendly name for vehicle
      type: string
      minLength: 1
      maxLength: 40
      examples:
        - Van 1
        - A-345
    VehicleActive:
      $schema: 'https://json-schema.org/draft/2020-12/schema'
      description: >
        Whether this vehicle is active. An inactive vehicle cannot be assigned
        and

        cannot be part of a purchase.
      type: boolean
      examples:
        - true
        - false
    VehicleLicensePlate-2:
      $schema: 'https://json-schema.org/draft/2020-12/schema'
      description: |
        License plate for vehicle
      type: string
      minLength: 2
      maxLength: 9
      pattern: '^(?:[0-9A-Z]+([ -][0-9A-Z]+)?)$'
      examples:
        - ABC-1234
        - ABC 123
        - A2
    Null-3:
      $schema: 'https://json-schema.org/draft/2020-12/schema'
      type: 'null'
      title: 'null'
      description: No value
      example: 'null'
    VehicleLicensePlateState:
      $schema: 'https://json-schema.org/draft/2020-12/schema'
      description: Optional state for identifying vehicle
      anyOf:
        - $ref: '#/components/schemas/USState'
    VehicleMake:
      $schema: 'https://json-schema.org/draft/2020-12/schema'
      description: Make of the vehicle
      type: string
      minLength: 1
      maxLength: 40
      title: Vehicle Make
      examples:
        - Chevrolet
        - Ford
    VehicleModel:
      $schema: 'https://json-schema.org/draft/2020-12/schema'
      description: Model of the vehicle
      type: string
      minLength: 1
      maxLength: 40
      title: VehicleModel
      examples:
        - Sprinter
        - Transit
    VehicleModelYear:
      $schema: 'https://json-schema.org/draft/2020-12/schema'
      description: Model year of the vehicle
      type: integer
      minimum: 1950
      maximum: 2050
      examples:
        - 2010
        - 1990
    VehicleVin-2:
      $schema: 'https://json-schema.org/draft/2020-12/schema'
      description: VIN for the vehicle
      type: string
      pattern: '^[A-Z0-9]{17}$'
      examples:
        - 1234567890ABCDEFG
    FuelType-2:
      $schema: 'https://json-schema.org/draft/2020-12/schema'
      description: Fuel type
      type: string
      enum:
        - diesel
        - unleadedRegular
        - unleadedPlus
        - unleadedSuper
        - other
      example: diesel
    VehicleFuelType:
      $schema: 'https://json-schema.org/draft/2020-12/schema'
      description: Optional fuel type for the vehicle
      anyOf:
        - $ref: '#/components/schemas/FuelType-2'
        - $ref: '#/components/schemas/Null-3'
    VehicleTankCapacity:
      $schema: 'https://json-schema.org/draft/2020-12/schema'
      description: |
        Optional tank capacity of the vehicle in US gallons.
      type: number
      minimum: 1
      examples:
        - 12.5
    VehicleLargeTankMaxAuthAmount:
      $schema: 'https://json-schema.org/draft/2020-12/schema'
      description: >
        Maximum authorization amount in cents for large tank vehicles at the
        pump.

        Must be between $350 and $1000 (35000-100000 cents).
      type: integer
      minimum: 35000
      maximum: 100000
      examples:
        - 50000
    VehicleDepartmentId:
      $schema: 'https://json-schema.org/draft/2020-12/schema'
      description: Optional department id for the vehicle
      anyOf:
        - $ref: '#/components/schemas/DepartmentId-4'
    VehicleLocationId:
      $schema: 'https://json-schema.org/draft/2020-12/schema'
      description: Optional location id for the vehicle
      anyOf:
        - $ref: '#/components/schemas/LocationId-4'
    VehiclePolicyId:
      $schema: 'https://json-schema.org/draft/2020-12/schema'
      description: Optional policy id for the vehicle
      anyOf:
        - $ref: '#/components/schemas/PolicyId'
    VehicleAssignedPersonId:
      $schema: 'https://json-schema.org/draft/2020-12/schema'
      description: Person assigned to this vehicle
      anyOf:
        - $ref: '#/components/schemas/PersonId'
    PersonIdV2-2:
      $schema: 'https://json-schema.org/draft/2020-12/schema'
      description: Person identifier
      type: string
      pattern: ^user_.*$
    VehicleSource:
      $schema: 'https://json-schema.org/draft/2020-12/schema'
      description: Source for how the vehicle was created
      oneOf:
        - type: object
          description: Vehicle created by the system
          required:
            - type
            - id
          properties:
            type:
              type: string
              enum:
                - system
            id:
              $ref: '#/components/schemas/Null-3'
          additionalProperties: false
        - type: object
          description: Vehicle created via non-vendor public API
          required:
            - type
            - id
          properties:
            type:
              type: string
              enum:
                - external
            id:
              $ref: '#/components/schemas/Null-3'
          additionalProperties: false
        - type: object
          description: Vehicle created manually by a Coast user
          required:
            - type
            - id
          properties:
            type:
              type: string
              enum:
                - manual
            id:
              anyOf:
                - $ref: '#/components/schemas/PersonIdV2-2'
                - $ref: '#/components/schemas/Null-3'
          additionalProperties: false
        - type: object
          description: Vehicle created by an integration
          required:
            - type
            - id
          properties:
            type:
              type: string
              enum:
                - integration
            id:
              anyOf:
                - type: string
                  description: Integration identifier
                - $ref: '#/components/schemas/Null-3'
          additionalProperties: false
    ISO8601DateTime-2:
      $schema: 'https://json-schema.org/draft/2020-12/schema'
      description: An ISO 8601 compatible timestamp
      type: string
      format: date-time
      examples:
        - '2020-01-01T12:00:00.000Z'
    Vehicle:
      $schema: 'https://json-schema.org/draft/2020-12/schema'
      description: Vehicle object
      type: object
      required:
        - id
        - accountId
        - name
        - active
        - licensePlate
        - licensePlateState
        - make
        - model
        - modelYear
        - vin
        - fuelType
        - tankCapacity
        - departmentId
        - departmentDetails
        - locationId
        - locationDetails
        - policyId
        - policyDetails
        - assignedPeopleIds
        - source
        - createdTime
      properties:
        id:
          $ref: '#/components/schemas/VehicleId'
        accountId:
          $ref: '#/components/schemas/AccountId-2'
        name:
          $ref: '#/components/schemas/VehicleName-2'
        active:
          $ref: '#/components/schemas/VehicleActive'
        licensePlate:
          anyOf:
            - $ref: '#/components/schemas/VehicleLicensePlate-2'
            - $ref: '#/components/schemas/Null-3'
        licensePlateState:
          anyOf:
            - $ref: '#/components/schemas/VehicleLicensePlateState'
            - $ref: '#/components/schemas/Null-3'
        make:
          anyOf:
            - $ref: '#/components/schemas/VehicleMake'
            - $ref: '#/components/schemas/Null-3'
        model:
          anyOf:
            - $ref: '#/components/schemas/VehicleModel'
            - $ref: '#/components/schemas/Null-3'
        modelYear:
          anyOf:
            - $ref: '#/components/schemas/VehicleModelYear'
            - $ref: '#/components/schemas/Null-3'
        vin:
          anyOf:
            - $ref: '#/components/schemas/VehicleVin-2'
            - $ref: '#/components/schemas/Null-3'
        fuelType:
          $ref: '#/components/schemas/VehicleFuelType'
        tankCapacity:
          anyOf:
            - $ref: '#/components/schemas/VehicleTankCapacity'
            - $ref: '#/components/schemas/Null-3'
        largeTankMaxAuthAmount:
          anyOf:
            - $ref: '#/components/schemas/VehicleLargeTankMaxAuthAmount'
            - $ref: '#/components/schemas/Null-3'
        departmentId:
          anyOf:
            - $ref: '#/components/schemas/VehicleDepartmentId'
            - $ref: '#/components/schemas/Null-3'
        departmentDetails:
          description: Null if departmentId is null
          oneOf:
            - $ref: '#/components/schemas/EntityDetails'
            - $ref: '#/components/schemas/Null-3'
        locationId:
          anyOf:
            - $ref: '#/components/schemas/VehicleLocationId'
            - $ref: '#/components/schemas/Null-3'
        locationDetails:
          description: Null if locationId is null
          oneOf:
            - $ref: '#/components/schemas/EntityDetails'
            - $ref: '#/components/schemas/Null-3'
        policyId:
          anyOf:
            - $ref: '#/components/schemas/VehiclePolicyId'
            - $ref: '#/components/schemas/Null-3'
        policyDetails:
          description: Null if policyId is null
          oneOf:
            - $ref: '#/components/schemas/EntityDetails'
            - $ref: '#/components/schemas/Null-3'
        assignedPeopleIds:
          type: array
          items:
            $ref: '#/components/schemas/VehicleAssignedPersonId'
        source:
          $ref: '#/components/schemas/VehicleSource'
        createdTime:
          anyOf:
            - $ref: '#/components/schemas/ISO8601DateTime-2'
            - $ref: '#/components/schemas/Null-3'
      additionalProperties: false
    LicensePlateConflictError:
      $schema: 'https://json-schema.org/draft/2020-12/schema'
      type: object
      description: License plate already exists
      required:
        - type
        - licensePlate
      properties:
        type:
          type: string
          const: licensePlateConflict
          example: licensePlateConflict

          $ref: '#/components/schemas/PersonIdV2'
      additionalProperties: false
    PublicV2PolicyType:
      $schema: 'https://json-schema.org/draft/2020-12/schema'
      description: Policy type
      type: string
      enum:
        - people
        - vehicle
      examples:
        - people
        - vehicle
    PublicV2NextPageToken:
      $schema: 'https://json-schema.org/draft/2020-12/schema'
      description: >-
        Token for retrieving the next page of results. If null or not present,
        there are no more pages available.
      type:
        - string
        - 'null'
    PublicV2PolicyId:
      $schema: 'https://json-schema.org/draft/2020-12/schema'
      description: Policy identifier
      type: string
      pattern: ^plcy_.*$
      examples:
        - plcy_283fasd
    PublicV2AccountId:
      $schema: 'https://json-schema.org/draft/2020-12/schema'
      description: Account identifier
      type: string
      pattern: ^flt_.*$
    PublicV2PolicyName:
      $schema: 'https://json-schema.org/draft/2020-12/schema'
      description: Name of the policy
      type: string
      examples:
        - Driver Policy
    PublicV2PolicyArchived:
      $schema: 'https://json-schema.org/draft/2020-12/schema'
      description: |
        If true, this policy is NOT able to be assigned to a person or vehicle.
      type: boolean
      example: true
    PublicV2PolicyTimezone:
      $schema: 'https://json-schema.org/draft/2020-12/schema'
      description: Policy timezone
      type: string
      enum:
        - eastern
        - central
        - mountain
        - pacific
        - alaska
        - hawaii
      example: eastern
    PublicV2PolicyMerchantCategory:
      $schema: 'https://json-schema.org/draft/2020-12/schema'
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: integer
          example: 12
        name:
          type: string
          minLength: 1
          example: Gas Stations
      additionalProperties: false
    PublicV2PolicyTimeFrame:
      $schema: 'https://json-schema.org/draft/2020-12/schema'
      description: Policy time frame
      type: string
      enum:
        - daily
        - weekly
        - monthly
      example: daily
    PublicV2PolicyTimeFrameCount:
      $schema: 'https://json-schema.org/draft/2020-12/schema'
      description: Policy time frame limit
      type: object
      required:
        - count
        - timeFrame
      properties:
        count:
          type: integer
          minimum: 0
          example: 10
        timeFrame:
          $ref: '#/components/schemas/PublicV2PolicyTimeFrame'
      additionalProperties: false
    PublicV2Null:
      $schema: 'https://json-schema.org/draft/2020-12/schema'
      type: 'null'
      title: 'null'
      description: No value
    PublicV2PolicyTimeFrameAmount:
      $schema: 'https://json-schema.org/draft/2020-12/schema'
      description: Policy time frame amount
      type: object
      required:
        - amount
        - timeFrame
      properties:
        amount:
          description: The amount in cents
          type: integer
          minimum: 0
          example: 10
        timeFrame:
          $ref: '#/components/schemas/PublicV2PolicyTimeFrame'
      additionalProperties: false
    PublicV2PolicyThresholdAmount:
      $schema: 'https://json-schema.org/draft/2020-12/schema'
      description: Policy threshold amount
      oneOf:
        - type: integer
          minimum: 0
          example: 500
        - $ref: '#/components/schemas/PublicV2Null'
    PublicV2PolicyCustomSpendControl:
      $schema: 'https://json-schema.org/draft/2020-12/schema'
      description: Custom spend control
      type: object
      required:
        - name
        - allowedMerchantCategories
        - numberOfPurchases
        - totalSpend
        - individualPurchaseAmountLimit
        - memoThresholdAmount
        - receiptThresholdAmount
      properties:
        name:
          type: string
          minLength: 1
          example: Gas and Restaurants
        allowedMerchantCategories:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/PublicV2PolicyMerchantCategory'
        numberOfPurchases:
          oneOf:
            - $ref: '#/components/schemas/PublicV2PolicyTimeFrameCount'
            - $ref: '#/components/schemas/PublicV2Null'
        totalSpend:
          oneOf:
            - $ref: '#/components/schemas/PublicV2PolicyTimeFrameAmount'
            - $ref: '#/components/schemas/PublicV2Null'
        individualPurchaseAmountLimit:
          description: The limit for an individual purchase amount in cents
          $ref: '#/components/schemas/PublicV2PolicyThresholdAmount'
        memoThresholdAmount:
          description: >-
            The threshold amount in cents where a memo is requested after a
            purchase. If set to 0, all purchases will require a memo.
          $ref: '#/components/schemas/PublicV2PolicyThresholdAmount'
        receiptThresholdAmount:
          description: >-
            The threshold amount in cents where a receipt is requested after a
            purchase. If set to 0, all purchases will require a receipt.
          $ref: '#/components/schemas/PublicV2PolicyThresholdAmount'
      additionalProperties: false
    PublicV2PolicyGlobalSpendLimit:
      $schema: 'https://json-schema.org/draft/2020-12/schema'
      description: Policy global spend limit
      type: object
      required:
        - numberOfPurchases
        - totalSpend
        - individualPurchaseAmountLimit
        - memoThresholdAmount
        - receiptThresholdAmount
      properties:
        numberOfPurchases:
          oneOf:
            - $ref: '#/components/schemas/PublicV2PolicyTimeFrameCount'
            - $ref: '#/components/schemas/PublicV2Null'
        totalSpend:
          oneOf:
            - $ref: '#/components/schemas/PublicV2PolicyTimeFrameAmount'
            - $ref: '#/components/schemas/PublicV2Null'
        individualPurchaseAmountLimit:
          description: The limit for an individual purchase amount in cents
          $ref: '#/components/schemas/PublicV2PolicyThresholdAmount'
        memoThresholdAmount:
          description: >-
            The threshold amount in cents where a memo is requested after a
            purchase. If set to 0, all purchases will require a memo.
          $ref: '#/components/schemas/PublicV2PolicyThresholdAmount'
        receiptThresholdAmount:
          description: >-
            The threshold amount in cents where a receipt is requested after a
            purchase. If set to 0, all purchases will require a receipt.
          $ref: '#/components/schemas/PublicV2PolicyThresholdAmount'
      additionalProperties: false
    PublicV2PolicyTimeWindowAllDayPermission:
      $schema: 'https://json-schema.org/draft/2020-12/schema'
      type: object
      title: All Day
      description: The time window allows or disallows spending for the entire day.
      required:
        - spendWindow
      properties:
        spendWindow:
          type: string
          enum:
            - allDay
            - blocked
          examples:
            - allDay
            - blocked
      additionalProperties: false
    PublicV2PolicyTimeWindowTime:
      $schema: 'https://json-schema.org/draft/2020-12/schema'
      description: >
        Represents all valid times for describing a time window. This is a 24
        hour time that only supports 30 minute increments.
      type: string
      pattern: '^([01]\d|2[0-3]):(00|30)$'
      examples:
        - '00:00'
        - '08:00'
        - '17:30'
        - '23:30'
    PublicV2PolicyTimeWindowRange:
      $schema: 'https://json-schema.org/draft/2020-12/schema'
      type: object
      title: Range
      description: This time window allows spending within the range from start to end.
      required:
        - spendWindow
        - start
        - end
      properties:
        spendWindow:
          type: string
          const: range
          example: range
        start:
          description: The start time of the time window
          $ref: '#/components/schemas/PublicV2PolicyTimeWindowTime'
        end:
          description: The end time of the time window
          $ref: '#/components/schemas/PublicV2PolicyTimeWindowTime'
      additionalProperties: false
    PublicV2PolicyTimeWindow:
      $schema: 'https://json-schema.org/draft/2020-12/schema'
      description: Policy time window
      oneOf:
        - $ref: '#/components/schemas/PublicV2PolicyTimeWindowAllDayPermission'

openapi: 3.1.0
info:
  title: Coast API
  version: 2.0.0
  contact:
    email: support@coastpay.com
    url: 'https://coastpay.com'
  description: >
    # Coast API

    Last updated: 2026-02-24


    ## Introduction

    The Coast API allows you programmatically manage Coast resources so you can
    connect your systems and build powerful integrations. This guide will help
    you understand the common API patterns, properties of core resources and how
    to authenticate and make your first API call. This guide assumes you are a
    Coast customer with admin access to your Coast portal instance. 


    The Coast API is organized around REST. It has predictable resource-oriented
    URLs such that you interact with objects such as people, vehicles, cards,
    and policies. The Coast API is account-scoped: every request operates within
    a single Coast account. 


    ## Authentication

    All Coast API requests must be authenticated using an API key. To obtain an
    API key for your Coast account follow these steps:

    1. Login to your account in the Coast portal

    2. Click on Integrations and go to the API keys page

    3. Click on New API key and provide a name

    4. Proceed to copy and securely store your newly created API key


    Authentication is performed by including your API key in the request
    headers. The API key identifies the Coast account on whose behalf the
    request is being made.



    Example:

    ```

    Authorization: Bearer YOUR_API_KEY

    ```

    API keys should be treated as secrets and stored securely. Do not embed them
    directly in client-side applications.


    ## Making Your First Request

    All API requests are made by appending resource paths to the base URL:
    https://public.coastpay.com


    The Coast API uses standard HTTP methods and JSON payloads.


    Example: Retrieving a list of people

    ```

    curl -X GET https://public.demo.coastpay.com/v2/people \
      -H "Authorization: Bearer YOUR_API_KEY"
    ```


    ## Standard Patterns

    Request bodies and responses are JSON-encoded and include standard HTTP
    status codes. Errors are documented on a per endpoint basis. All responses
    follow consistent patterns to make integrations predictable.


    Standard HTTP methods are used:

    * `GET` for retrieval

    * `POST` for creation

    * `PATCH` for updates with the exception of the Policies resource where
    `PUT` method is used


    ### PATCH Requests

    A PATCH request allows you to modify a resource with any amount of
    granularity desired. Any keys left off of a PATCH request will not be
    changed. A present key with the value of null will set that value to null.


    **Example**

    This body will change the name to Bob but not set an address.

    ```

    {
      "name": "Bob"
    }

    ```

    This body will change the name to Bob and set the address to null.

    ```

    {
      "name": "Bob",
      "address": null
    }

    ```


    ### Missing a Key Versus Null

    JSON request bodies that leave off a key will be treated as if that value is
    set to the value null. The only exception is PATCH requests.


    **Example**

    These two requests are equivalent. They both set name to Bob and address to
    null.

    ```

    {
      "name": "Bob",
      "address": null
    }

    ```

    ```

    {
      "name": "Bob"
    }

    ```


    ### Errors

    The Coast API uses standard HTTP status codes to indicate success or
    failure. In general, codes in the 2xx range indicate success. Codes in the
    4xx range indicate an error that failed given the information provided
    (e.g., a required parameter was omitted, a charge failed, etc.). Codes in
    the 5xx range indicate an error with Coast’s servers.


    When an error occurs, the response includes:

    * An HTTP status code

    * A structured error object describing what went wrong


    Integrations should be built to handle errors gracefully and retry when
    appropriate.


    Common error scenarios include:

    * Invalid request parameters

    * Authentication failures

    * Permission or validation errors

    * Rate limiting


    ## Pagination

    List endpoints in the Coast API use token-based pagination. Pagination
    ensures predictable performance for large datasets.


    When retrieving a collection of resources:

    * Each paginated response includes nextPageToken field when applicable

    * The token can be passed to subsequent requests to retrieve the next page

    * Pages have a maximum size of 100 and the default size is 10

    * The last page is retrieved when the next page token is `null`


    You should always be prepared to paginate through results rather than
    assuming all data will be returned in a single response.


    ## Filtering

    Many list endpoints support filtering via query parameters.


    Filtering allows you to:

    * Limit results based on attributes such as status or relationships

    * Reduce the volume of data returned

    * Build efficient sync processes


    Supported filters vary by resource and are documented by endpoint.


    ## Rate Limiting

    To protect platform stability, the Coast API enforces rate limits. All
    endpoints are rate limited on an account basis at 200 requests for every
    rolling 10 second window. If your request is rate limited, you will receive
    a 429 HTTP response and a Retry-After header telling you when it is possible
    to retry requests.

    Integrations should be designed to:

    * Respect rate limits

    * Retry requests when appropriate

    * Avoid excessive polling


    The recommended practice to handle rate limiting in each call to the Coast
    API is to:

    1. Look for a 429 status code and retry after the time returned in the
    `X-Retry-After` header.

    2. Use an exponential backoff when retrying a rate limited request


    ## Versioning

    The Coast API is versioned to support long-term stability.

    * The current version is V2

    * Breaking changes are avoided within a major version

    * Additive non-breaking changes may be introduced over time. For example, a
    new optional field may be added to a request object, a query param, or a
    response object.


    All endpoints are backwards compatible. However, the endpoints may change
    over time. Integrations built against V2 should consider the possibility
    that an API shape may change so the integrations can continue to function as
    the API evolves.
servers:
  - url: 'https://public.coastpay.com'
    description: Production
  - url: 'https://public.demo.coastpay.com'
    description: Demo / Developer Sandbox
tags:
  - name: Accounts
    x-displayName: Accounts
    description: >
      An account represents a Coast customer’s business entity. An account
      contains:

      * Company information (display name, legal name, business address)

      * Account-level settings that affect other resources


      All API access is scoped to a single account. All other resources exist
      within the context of an account.
  - name: Cards
    x-displayName: Cards
    description: >
      This object represents physical or virtual credit cards issued by Coast.
      Cards must be assigned to People or Vehicles before they can be used for
      making purchases. The spend limits and restrictions on a Card are governed
      by the Policies associated with the People or Vehicles that the Card is
      assigned to at the time of the purchase.


      Cards can have one of the following statuses:

      * __Active__ - ready for use

      * __Locked__ - temporarily disabled

      * __Cancelled__ - permanently disabled

      * __Frozen__ - disabled due to risk-related events. To unfreeze a Card you
      must reach out to Coast support

      * __Pending activation__ - issued but not yet activated


      ### Physical Cards

      Physical cards are ordered through the Coast portal and shipped to your
      address of choice. When attempting to make a purchase with a Physical
      Card, Policies assigned to the Person and/or Vehicle that the Card is
      assigned to, are considered. If the purchase would violate the rules of
      either policy (e.g., the merchant category is not allowed), the
      transaction is declined.


      There are three types of Physical Cards:

      * __Fleet cards__ -
        These must be assigned to a Person to make a purchase. To make a fuel purchase, the Person must also be assigned to a Vehicle. These can be re-assigned to different People any number of times. Typically the assignment happens when the Person uses the Coast mobile app or a SMS workflow to sign in to the Card. However, you can also use the assignedPersonId attribute in the PATCH method for this.

        These have a Fleet Card ID which is a 6 or 7 character string consisting of a 3-4 character prefix followed by a 3 digit suffix (e.g. ABC123 or ABCD001)
      * __Personalized cards__ -
        These are permanently assigned to a specific Person. Fuel purchases require a Vehicle to be assigned to the Person.

      * __Vehicle PIN cards__ -
        These cards require the user to enter a PIN at the pump to identify the Person. The PIN must be at least 6 digits. These are an alternative to Fleet Cards that are used when you want to avoid mobile app or SMS workflows for the cardholders (drivers). The PIN is used to assign the Person to the Card instead of the mobile app or SMS.

      Physical Cards allow you to set the gas station purchase restrictions that
      limit what can be bought at fuel merchants. This can only be set at the
      time of ordering the Card and cannot be updated as it is programmed into
      the chip of the Card.


      ### Virtual Cards

      Virtual Cards are digital-only cards that can be associated with one or
      more People. Purchases on Virtual Cards are governed by the spend
      restrictions on Policies assigned to the People associated with the Card.
      Additionally, a card limit can be added directly to the Virtual Card. 


      There are two types of Virtual Cards:

      * __Everyday Purchase Cards__ -
        These are permanently assigned to one Person for general purpose use. These can be identified in the Card object by the type = everydayPurchase

      * __Subscription Cards__ -
        These Virtual Cards can be shared by multiple People. You must assign a primary Person (using the primaryPersonId attribute) whose name will appear for purchases made on this Card. You can also assign other People (using the otherPersonIds array) to this Card and update this list at any time. 
  - name: Departments
    x-displayName: Departments
    description: >
      A department is an organizational unit used to group people and vehicles.


      Key characteristics:

      * Have a unique name within an account

      * Can be assigned to people and vehicles

      * Departments must be unassigned from all people and vehicles before they
      can be deleted
  - name: Locations
    x-displayName: Locations
    description: >
      A location is an organizational unit used to group people and vehicles.


      Key characteristics:

      * Have a unique name within an account

      * Can be assigned to people and vehicles

      * May include an address used for operational purposes

      * Locations must be unassigned from all people and vehicles before they
      can be deleted
  - name: People
    x-displayName: People
    description: >
      This object represents the individuals associated with an Account, such as
      admins, managers or drivers. 


      Use the People resource to:

      * Provision cards

      * Assign vehicles

      * Apply spend policies

      * Authenticate into Coast applications


      Key characteristics:

      * Each Person is unique within an account

      * Email, phone number, or PIN values must be unique across People in the
      same account

      * People can be deactivated and reactivated but not permanently deleted


      Email and phone numbers are used for user authentication. Any changes made
      to these will impact the user’s ability to login to Coast systems.


      A single Person may be in multiple Accounts, but each Account will
      represent that individual as a separate Person. If this Person has the
      same phone number across the multiple accounts, their email must also be
      the same. 
  - name: Policies
    x-displayName: Policies
    description: >
      Policies are a set of controls that govern the spending limits and
      restrictions for People or Vehicles.


      Use Policies resource to:

      * Control spend limits

      * Restrict purchases to specific merchant categories

      * Enforce receipt or memo requirements

      * Apply time-based purchase rules


      Key characteristics:

      * There are two types of Policies: People Policies and Vehicle Policies

      * Policy names must be unique within an account

      * Policies can be archived and unarchived

      * Policies are applied prospectively, not retroactively
  - name: Roles
    x-displayName: Roles
    description: >
      Roles define what features a Person is allowed to access or manage within
      Coast. This is governed by a set of permissions within each Role. There
      are two broad categories of Roles - built-in and custom. 


      Built-in roles are the default roles available in your Coast account.
      These include the following:

      * __Account Owner__ - Full access to all settings, people, and activity.
      This is typically the person who signed up for Coast. This role can't be
      changed.

      * __Admin__ - Full access to all settings, people, and activity. This role
      can't be changed.

      * __Manager__ - Manages spend and people based on reporting structure or
      regional oversight. They can only access the activity of People within
      assigned Departments and/or Locations.

      * __Office Team Member__ - People who can view their own purchases and
      cards in Coast.

      * __Field Team Member__ - Standard People who can spend on Coast cards and
      add information to purchases via text or mobile app. They are not able to
      log into the Coast portal to access their purchases or other features


      Permissions cannot be changed for the built-in roles except for the
      Manager role. Names can be changed for all Roles except the Account Owner
      and Admin Roles.


      You can also use the POST method to create a custom role. You can set the
      name, description and permissions for custom Roles as you choose.  The
      Built-in Manager Role is a Custom Role that is pre-configured in your
      Account.
  - name: Transactions
    x-displayName: Transactions
    description: >
      There are four types of Transactions: Purchases, Payments, Credits, and
      Fees. Purchases represent expenses incurred using Coast cards. Refunds are
      represented as Purchases with a negative amount value. 


      A Purchase is created by the card network and may evolve through multiple
      events as the final amount is determined. It can move through multiple
      statuses such as pending, completed, or declined. A Purchase with
      completed status is considered a terminal state and reflects the final
      purchase amount and any associated metadata such as rebate amount and fuel
      details (type, volume, etc.) when relevant.


      At this time, only purchases are available by API.
  - name: Vehicles
    x-displayName: Vehicles
    description: >
      This object represents cars, trucks, or other fleet assets in an Account.


      Use Vehicles resource to:

      * Associate spend with a specific asset

      * Apply vehicle-based spend policies

      * Update telemetry data


      Key characteristics:

      * Vehicles are uniquely identified by either a license plate or a vehicle
      name, based on account settings

      * Vehicles can be assigned to multiple people

      * Vehicles can be associated with vehicle PIN cards

      * Vehicles can be deactivated and reactivated but not permanently deleted


      Vehicles may also store operational metadata such as odometer readings or
      fuel-related information.
paths:
  /v2/account:
    get:
      summary: Get account
      description: Get account information
      operationId: getAccount
      responses:
        '200':
          $ref: '#/components/responses/200-GetAccountResponse'
        '400':
          $ref: '#/components/responses/400-BadRequestError'
        '401':
          $ref: '#/components/responses/401-AuthenticationError'
        '403':
          $ref: '#/components/responses/403-ForbiddenError'
        '404':
          $ref: '#/components/responses/404-AccountNotFoundError'
        '429':
          $ref: '#/components/responses/429-TooManyRequestsError'
        '500':
          $ref: '#/components/responses/500-InternalServerError'
      tags:
        - Accounts
      security:
        - ApiKeyAuth:
            - 'account:view'
  /v2/account/settings:
    patch:
      summary: Update account settings
      description: Update account settings
      operationId: updateMyAccountSettings
      requestBody:
        $ref: '#/components/requestBodies/UpdateAccountSettingsRequest'
      responses:
        '200':
          $ref: '#/components/responses/200-GetAccountResponse'
        '400':
          $ref: '#/components/responses/400-PatchAccountSettingsBadRequestError'
        '401':
          $ref: '#/components/responses/401-AuthenticationError'
        '403':
          $ref: '#/components/responses/403-ForbiddenError'
        '422':
          $ref: >-
            #/components/responses/422-PatchAccountSettingsUnprocessableEntityError
        '429':
          $ref: '#/components/responses/429-TooManyRequestsError'
        '500':
          $ref: '#/components/responses/500-InternalServerError'
      tags:
        - Accounts
      security:
        - ApiKeyAuth:
            - 'account:edit'
  /v2/cards:
    get:
      summary: Get all cards
      description: Gets all cards.
      operationId: getCards
      parameters:
        - $ref: '#/components/parameters/queryNextPageToken'
        - $ref: '#/components/parameters/queryPageSize'
        - $ref: '#/components/parameters/queryPersonId'
        - $ref: '#/components/parameters/queryVehicleId'
        - $ref: '#/components/parameters/queryStatus'
      responses:
        '200':
          $ref: '#/components/responses/200-GetCardsResponse'
        '400':
          $ref: '#/components/responses/400-BadRequestError-2'
        '401':
          $ref: '#/components/responses/401-AuthenticationError'
        '403':
          $ref: '#/components/responses/403-ForbiddenError'
        '429':
          $ref: '#/components/responses/429-TooManyRequestsError'
        '500':
          $ref: '#/components/responses/500-InternalServerError'
      tags:
        - Cards
      security:
        - ApiKeyAuth:
            - 'card:view'
  '/v2/cards/{cardId}':
    parameters:
      - $ref: '#/components/parameters/pathCardId'
    get:
      summary: Get card by ID
      description: Gets a card by ID.
      operationId: getCard
      responses:
        '200':
          $ref: '#/components/responses/200-GetCardResponse'
        '400':
          $ref: '#/components/responses/400-BadRequestError-2'
        '401':
          $ref: '#/components/responses/401-AuthenticationError'
        '403':
          $ref: '#/components/responses/403-ForbiddenError'
        '404':
          $ref: '#/components/responses/404-CardNotFoundError'
        '429':
          $ref: '#/components/responses/429-TooManyRequestsError'
        '500':
          $ref: '#/components/responses/500-InternalServerError'
      tags:
        - Cards
      security:
        - ApiKeyAuth:
            - 'card:view'
    patch:
      summary: Update card by ID
      description: Updates a card by ID.
      operationId: updateCard
      requestBody:
        $ref: '#/components/requestBodies/UpdateCardRequest'
      responses:
        '200':
          $ref: '#/components/responses/200-GetCardResponse'
        '400':
          $ref: '#/components/responses/400-UpdateCardBadRequestError'
        '401':
          $ref: '#/components/responses/401-AuthenticationError'
        '403':
          $ref: '#/components/responses/403-ForbiddenError'
        '404':
          $ref: '#/components/responses/404-CardNotFoundError'
        '429':
          $ref: '#/components/responses/429-TooManyRequestsError'
        '500':
          $ref: '#/components/responses/500-InternalServerError'
      tags:
        - Cards
      security:
        - ApiKeyAuth:
            - 'card:edit'
  /v2/cards/virtual:
    post:
      summary: Create virtual card
      description: Orders virtual card for the fleet.
      operationId: orderVirtualCard
      requestBody:
        $ref: '#/components/requestBodies/OrderVirtualCardRequest'
      responses:
        '201':
          $ref: '#/components/responses/201-OrderVirtualCardResponse'
        '400':
          $ref: '#/components/responses/400-BadRequestError-2'
        '401':
          $ref: '#/components/responses/401-AuthenticationError'
        '403':
          $ref: '#/components/responses/403-ForbiddenError'
        '429':
          $ref: '#/components/responses/429-TooManyRequestsError'
        '500':
          $ref: '#/components/responses/500-InternalServerError'
      tags:
        - Cards
      security:
        - ApiKeyAuth:
            - 'virtual_card:create'
  /v2/departments:
    get:
      summary: Get all departments
      description: Gets all departments.
      operationId: getDepartments
      parameters:
        - $ref: '#/components/parameters/queryNextPageToken'
        - $ref: '#/components/parameters/queryPageSize-2'
      responses:
        '200':
          $ref: '#/components/responses/200-GetDepartmentsResponse'
        '400':
          $ref: '#/components/responses/400-BadRequestError'
        '401':
          $ref: '#/components/responses/401-AuthenticationError'
        '403':
          $ref: '#/components/responses/403-ForbiddenError'
        '429':
          $ref: '#/components/responses/429-TooManyRequestsError'
        '500':
          $ref: '#/components/responses/500-InternalServerError'
      tags:
        - Departments
      security:
        - ApiKeyAuth:
            - 'department:view'
    post:
      summary: Create department
      description: Creates a department.
      operationId: createDepartment
      requestBody:
        $ref: '#/components/requestBodies/CreateDepartmentRequest'
      responses:
        '201':
          $ref: '#/components/responses/201-CreateDepartmentResponse'
        '400':
          $ref: '#/components/responses/400-BadRequestError'
        '401':
          $ref: '#/components/responses/401-AuthenticationError'
        '403':
          $ref: '#/components/responses/403-ForbiddenError'
        '429':
          $ref: '#/components/responses/429-TooManyRequestsError'
        '500':
          $ref: '#/components/responses/500-InternalServerError'
      tags:
        - Departments
      security:
        - ApiKeyAuth:
            - 'department:create'
  '/v2/departments/{departmentId}':
    parameters:
      - $ref: '#/components/parameters/pathDepartmentId'
    get:
      summary: Get department by ID
      description: Gets a department by ID.
      operationId: getDepartment
      responses:
        '200':
          $ref: '#/components/responses/200-GetDepartmentResponse'
        '400':
          $ref: '#/components/responses/400-BadRequestError'
        '401':
          $ref: '#/components/responses/401-AuthenticationError'
        '403':
          $ref: '#/components/responses/403-ForbiddenError'
        '404':
          $ref: '#/components/responses/404-DepartmentNotFoundError'
        '429':
          $ref: '#/components/responses/429-TooManyRequestsError'
        '500':
          $ref: '#/components/responses/500-InternalServerError'
      tags:
        - Departments
      security:
        - ApiKeyAuth:
            - 'department:view'
    patch:
      summary: Update department by ID
      description: Updates a department by ID.
      operationId: updateDepartment
      requestBody:
        $ref: '#/components/requestBodies/UpdateDepartmentRequest'
      responses:
        '200':
          $ref: '#/components/responses/200-GetDepartmentResponse'
        '400':
          $ref: '#/components/responses/400-BadRequestError'
        '401':
          $ref: '#/components/responses/401-AuthenticationError'
        '403':
          $ref: '#/components/responses/403-ForbiddenError'
        '404':
          $ref: '#/components/responses/404-DepartmentNotFoundError'
        '429':
          $ref: '#/components/responses/429-TooManyRequestsError'
        '500':
          $ref: '#/components/responses/500-InternalServerError'
      tags:
        - Departments
      security:
        - ApiKeyAuth:
            - 'department:edit'
    delete:
      summary: Delete department by ID
      description: >-
        Deletes a department by ID. The department must have no people or
        vehicles assigned to the department before it can be deleted.
      operationId: deleteDepartment
      responses:
        '204':
          $ref: '#/components/responses/204-DeleteDepartmentResponse'
        '400':
          $ref: '#/components/responses/400-DeleteDepartmentBadRequestError'
        '401':
          $ref: '#/components/responses/401-AuthenticationError'
        '403':
          $ref: '#/components/responses/403-ForbiddenError'
        '429':
          $ref: '#/components/responses/429-TooManyRequestsError'
        '500':
          $ref: '#/components/responses/500-InternalServerError'
      tags:
        - Departments
      security:
        - ApiKeyAuth:
            - 'department:delete'
  /v2/locations:
    get:
      summary: Get all locations
      description: Gets all locations.
      operationId: getLocations
      parameters:
        - $ref: '#/components/parameters/queryNextPageToken'
        - $ref: '#/components/parameters/queryPageSize-2'
      responses:
        '200':
          $ref: '#/components/responses/200-GetLocationsResponse'
        '400':
          $ref: '#/components/responses/400-BadRequestError'
        '401':
          $ref: '#/components/responses/401-AuthenticationError'
        '403':
          $ref: '#/components/responses/403-ForbiddenError'
        '429':
          $ref: '#/components/responses/429-TooManyRequestsError'
        '500':
          $ref: '#/components/responses/500-InternalServerError'
      tags:
        - Locations
      security:
        - ApiKeyAuth:
            - 'location:view'
    post:
      summary: Create location
      description: Creates a location.
      operationId: createLocation
      requestBody:
        $ref: '#/components/requestBodies/CreateLocationRequest'
      responses:
        '201':
          $ref: '#/components/responses/201-CreateLocationResponse'
        '400':
          $ref: '#/components/responses/400-BadRequestError'
        '401':
          $ref: '#/components/responses/401-AuthenticationError'
        '403':
          $ref: '#/components/responses/403-ForbiddenError'
        '429':
          $ref: '#/components/responses/429-TooManyRequestsError'
        '500':
          $ref: '#/components/responses/500-InternalServerError'
      tags:
        - Locations
      security:
        - ApiKeyAuth:
            - 'location:create'
  '/v2/locations/{locationId}':
    parameters:
      - $ref: '#/components/parameters/pathLocationId'
    get:
      summary: Get location by ID
      description: Gets a location by ID.
      operationId: getLocation
      responses:
        '200':
          $ref: '#/components/responses/200-GetLocationResponse'
        '400':
          $ref: '#/components/responses/400-BadRequestError'
        '401':
          $ref: '#/components/responses/401-AuthenticationError'
        '403':
          $ref: '#/components/responses/403-ForbiddenError'
        '404':
          $ref: '#/components/responses/404-LocationNotFoundError'
        '429':
          $ref: '#/components/responses/429-TooManyRequestsError'
        '500':
          $ref: '#/components/responses/500-InternalServerError'
      tags:
        - Locations
      security:
        - ApiKeyAuth:
            - 'location:view'
    patch:
      summary: Update location by ID
      description: Updates a location by ID.
      operationId: updateLocation
      requestBody:
        $ref: '#/components/requestBodies/UpdateLocationRequest'
      responses:
        '200':
          $ref: '#/components/responses/200-GetLocationResponse'
        '400':
          $ref: '#/components/responses/400-BadRequestError'
        '401':
          $ref: '#/components/responses/401-AuthenticationError'
        '403':
          $ref: '#/components/responses/403-ForbiddenError'
        '404':
          $ref: '#/components/responses/404-LocationNotFoundError'
        '429':

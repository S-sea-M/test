          const: locationNotFound
          example: locationNotFound
        locationId:
          $ref: '#/components/schemas/LocationId'
      additionalProperties: false
    LocationInUseBadRequestError:
      $schema: 'https://json-schema.org/draft/2020-12/schema'
      type: object
      description: >
        The location is still in use and cannot be deleted. Please remove all
        assignments before deleting.
      required:
        - type
        - locationId
      properties:
        type:
          type: string
          const: locationInUseBadRequest
          example: locationInUseBadRequest
        locationId:
          $ref: '#/components/schemas/LocationId'
      additionalProperties: false
    E164PhoneNumber:
      $schema: 'https://json-schema.org/draft/2020-12/schema'
      description: |
        E.164 formatted US phone number
      type: string
      pattern: '^\+[1-9][0-9]{1,14}$'
      examples:
        - '+15355550021'
    RoleId:
      $schema: 'https://json-schema.org/draft/2020-12/schema'
      description: Role identifier
      type: string
      pattern: ^role_.*$
      examples:
        - role_324kjs812
    NextPageTokenV2:
      description: >-
        Token for retrieving the next page of results. If null or not present,
        there are no more pages available.
      type:
        - string
        - 'null'
    PersonIdV2:
      description: Person identifier
      type: string
      pattern: ^user_.*$
    AccountIdV2:
      description: Account identifier
      type: string
      pattern: ^flt_.*$
    PersonActiveV2:
      description: 'If this value is false, the person cannot do anything in Coast'
      type: boolean
    PersonFirstNameV2:
      description: First name for person
      type: string
      minLength: 1
      maxLength: 40
      pattern: '^[^<>!;]*$'
    PersonLastNameV2:
      description: Last name for person
      type: string
      minLength: 1
      maxLength: 40
      pattern: '^[^<>!;]*$'
    EmailV2:
      description: Email
      type: string
      format: email
    Null-2:
      type: 'null'
      title: 'null'
      description: No value
    PersonEmailV2:
      description: Email for person
      anyOf:
        - $ref: '#/components/schemas/EmailV2'
        - $ref: '#/components/schemas/Null-2'
    PersonExternalIdV2:
      description: >
        The employee ID (external ID) for this person. This is an optional
        custom identifier that can be used to match records with external
        systems like HRIS platforms (e.g. ADP, Workday, BambooHR).


        Must be unique within the fleet if provided. Accepts 1-64 character
        strings containing letters (A-Z, case preserved), numbers, dashes, and
        underscores. Leading zeros are preserved.
      anyOf:
        - type: string
          minLength: 1
          maxLength: 64
          pattern: '^[A-Za-z0-9_-]{1,64}$'
        - $ref: '#/components/schemas/Null-2'
    PersonMobilePhoneV2:
      description: Valid phone number for person in E.167 format
      anyOf:
        - $ref: '#/components/schemas/E164PhoneNumber'
        - $ref: '#/components/schemas/Null-2'
    LocationId-2:
      description: Location identifier
      type: string
      pattern: ^lctn_.*$
    PersonLocationIdV2:
      description: Location for person
      anyOf:
        - $ref: '#/components/schemas/LocationId-2'
        - $ref: '#/components/schemas/Null-2'
    DepartmentId-2:
      description: Department identifier
      type: string
      pattern: ^dprt_.*$
    PersonDepartmentIdV2:
      description: Department for person
      anyOf:
        - $ref: '#/components/schemas/DepartmentId-2'
        - $ref: '#/components/schemas/Null-2'
    PersonAccessCustomDepartments:
      title: Person Access Custom Departments
      type: object
      required:
        - type
      properties:
        type:
          type: string
          enum:
            - all
            - some
          description: >
            Department access level:

            - 'all': The user can access all departments and all users who do
            not have a department, including departments that are not yet
            created.

            - 'some': The user can access specific specified departments. If new
            departments are created, the user will not have access to them until
            they are added to the list.
        departmentIds:
          description: >
            Array of department IDs the user can access. Required when type is
            'some', should not be provided when type is 'all'.
          type: array
          items:
            $ref: '#/components/schemas/DepartmentId-2'
        noDepartment:
          description: >
            If true, can access people and vehicles that do not have a
            department. Required when type is 'some', should not be provided
            when type is 'all'.
          type: boolean
      additionalProperties: false
    PersonAccessCustomLocations:
      title: Person Access Custom Locations
      type: object
      required:
        - type
      properties:
        type:
          type: string
          enum:
            - all
            - some
          description: >
            Location access level:

            - 'all': The user can access all locations and all users who do not
            have a location, including locations that are not yet created.

            - 'some': The user can access specific specified locations. If new
            locations are created, the user will not have access to them until
            they are added to the list.
        locationIds:
          description: >
            Array of location IDs the user can access. Required when type is
            'some', should not be provided when type is 'all'.
          type: array
          items:
            $ref: '#/components/schemas/LocationId-2'
        noLocation:
          description: >
            If true, can access people and vehicles that do not have a location.
            Required when type is 'some', should not be provided when type is
            'all'.
          type: boolean
      additionalProperties: false
    PersonAccess:
      title: Person Access
      type: object
      required:
        - type
      properties:
        type:
          type: string
          enum:
            - default
            - custom
          description: >
            The type of access: 'default' for default access to all departments
            and locations,

            or 'custom' for custom access with specific department and location
            restrictions.
        departments:
          description: >
            Department access configuration. Required when type is 'custom',
            should not be provided when type is 'default'.
          $ref: '#/components/schemas/PersonAccessCustomDepartments'
        locations:
          description: >
            Location access configuration. Required when type is 'custom',
            should not be provided when type is 'default'.
          $ref: '#/components/schemas/PersonAccessCustomLocations'
      additionalProperties: false
    PolicyId-2:
